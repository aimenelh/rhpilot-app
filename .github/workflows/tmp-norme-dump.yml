name: tmp-norme-dump

# Workflow temporaire : lit les nomenclatures P26V01 embarquées dans le Dsn-Val officiel
# déjà utilisé par la CI, et les publie sur une branche jetable. Supprimé avant fusion.
on:
  push:
    branches:
      - claude/dsn-pilotes-2026-10

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned official Dsn-Val
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 180 https://dsn-val.net-entreprises.fr/2026.1/autocontrole-dsn-val_linux_2026.1.0.17_64.zip --output "$RUNNER_TEMP/dsn-val.zip"
          echo "6b00a8c8fc9bb18891ee53026f971a42ca626675c7f63b2d2b0d64626b4f699e  $RUNNER_TEMP/dsn-val.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dsn-val.zip" -d "$RUNNER_TEMP/dsn-val"
      - name: Extract norm members
        shell: python
        run: |
          import io, os, zipfile
          root = os.path.join(os.environ["RUNNER_TEMP"], "dsn-val")
          out = os.path.join(os.environ["RUNNER_TEMP"], "out")
          os.makedirs(out, exist_ok=True)
          keys = [b"S21.G00.52.001", b"S21.G00.54.001", b"S21.G00.62.002"]
          inventory = []
          saved = []
          def scan(name, data, depth=0):
              if depth > 3:
                  return
              if data[:2] == b"PK":
                  try:
                      z = zipfile.ZipFile(io.BytesIO(data))
                  except Exception:
                      return
                  for info in z.infolist():
                      if info.file_size > 200_000_000:
                          continue
                      scan(name + "!" + info.filename, z.read(info), depth + 1)
                  return
              inventory.append(f"{len(data)} {name}")
              if any(k in data for k in keys) and len(data) < 40_000_000:
                  safe = name.replace("/", "__").replace("!", "--")
                  with open(os.path.join(out, safe), "wb") as h:
                      h.write(data)
                  saved.append(f"{len(data)} {name}")
          for base, _, files in os.walk(root):
              for f in files:
                  p = os.path.join(base, f)
                  if "org.eclipse" in p:
                      continue
                  with open(p, "rb") as h:
                      scan(os.path.relpath(p, root), h.read())
          with open(os.path.join(out, "_inventory.txt"), "w") as h:
              h.write("\n".join(sorted(inventory)))
          with open(os.path.join(out, "_saved.txt"), "w") as h:
              h.write("\n".join(saved))
      - name: Publish to throwaway branch
        shell: bash
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b tmp/norme-p26v01
          git add -A
          git commit -q -m "Nomenclatures P26V01 extraites de Dsn-Val 2026.1.0.17"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp/norme-p26v01
