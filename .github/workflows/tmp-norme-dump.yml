name: tmp-norme-dump

# Workflow temporaire : récupère les correspondances DIDA officielles de l'Urssaf
# (open.urssaf.fr) utiles aux apprentis et aux fins de contrat. Supprimé avant fusion.
on:
  push:
    branches:
      - claude/dsn-pilotes-2026-10

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch DIDA and CTP catalog
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          curl --fail --location --retry 3 --max-time 180 "https://open.urssaf.fr/api/explore/v2.1/catalog/datasets/equivalence-dida/exports/json" --output dida.json
          sha256sum dida.json > dida.sha256
          curl --fail --location --retry 3 --max-time 60 "https://open.urssaf.fr/api/explore/v2.1/catalog/datasets?where=search(%22CTP%22)&limit=50" --output catalog-ctp.json || true
          curl --fail --location --retry 3 --max-time 60 "https://open.urssaf.fr/api/explore/v2.1/catalog/datasets?where=search(%22DSN%22)&limit=50" --output catalog-dsn.json || true
          ls -la
      - name: Publish to throwaway branch
        shell: bash
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b tmp/norme-p26v01
          git add -A
          git commit -q -m "Correspondances DIDA Urssaf"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp/norme-p26v01
