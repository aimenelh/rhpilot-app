name: Payroll Core CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  payroll-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://rhpilot:rhpilot@127.0.0.1:5432/rhpilot_ci
      STRIPE_SECRET_KEY: sk_test_rhpilot_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_rhpilot_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_rhpilot_ci_placeholder
      CLERK_SECRET_KEY: sk_test_rhpilot_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run deterministic payroll unit tests
        run: >-
          npx vitest run
          src/lib/payroll/variable-treatment.test.ts
          src/lib/payroll/working-time-pay.test.ts
          src/lib/payroll/benefits-expenses-2026.test.ts
          src/lib/payroll/ijss-2026.test.ts
          src/lib/payroll/paid-leave-2026.test.ts
          src/lib/payroll/incomplete-month-2026.test.ts
          src/lib/payroll/termination-2026.test.ts
          src/lib/payroll/advanced-payroll-calculators.test.ts
          src/lib/payroll/absence-payroll-impact.test.ts
          src/lib/payroll/absence-payroll-gross-impact.test.ts
          src/lib/payroll/absence-payroll-treatment.test.ts
          src/lib/payroll/alternance-minimum.test.ts
          src/lib/payroll/alternance-minimum-snapshot.test.ts
          src/lib/payroll/payroll-ledger.test.ts
          src/lib/payroll/payroll-ledger-builder.test.ts
          src/lib/payroll/payslip-pdf.test.ts
          src/lib/payroll/payslip-pdf-merge.test.ts
          src/lib/payroll/withholding-tax-validation.test.ts
          src/lib/payroll/pas-dsn.test.ts
          src/lib/payroll/dsn-pii.test.ts
          src/lib/payroll/payroll-output-consistency.test.ts
          src/lib/payroll/dsn-p26v01.test.ts
          src/lib/payroll/dsn-p26v01-complete.test.ts
      - name: Run core RH regression tests
        run: >-
          npx vitest run
          src/lib/notificationSchedule.test.ts
          src/lib/task-attachment-storage.test.ts
          src/lib/probationTracking.test.ts
          src/lib/employeeCsv.test.ts
          src/lib/billingPolicy.test.ts
          src/lib/billingEmployeeScope.test.ts
          src/lib/ownership.test.ts
          src/lib/copilotPolicy.test.ts
          src/lib/employeeIdentity.test.ts
          src/lib/accessPolicy.test.ts
          src/lib/appUrl.test.ts
          src/lib/dateOnly.test.ts
          src/lib/csv.test.ts
      - name: Build application
        run: npx prisma generate && npx next build
